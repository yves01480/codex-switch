name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reject credential artifacts
        run: |
          ! git ls-files | grep -E '(^|/)auth(\..*)?\.json$|(^|/)registry\.json$'
      - name: Test profile manager
        run: python3 test_accounts.py
      - name: Test HTTPS bootstrap offline
        run: python3 test_bootstrap.py
      - name: Check installer shell
        run: sh -n cruxilion-codex.sh
      - name: Verify published manager checksum
        run: |
          expected="$(sed -n 's/^MANAGER_SHA256=//p' cruxilion-codex.sh)"
          actual="$(sha256sum codex_accounts.py | awk '{print $1}')"
          test "$expected" = "$actual"
      - name: Verify current site installer matches repository
        run: cmp cruxilion-codex.sh site/cruxilion-codex.sh
